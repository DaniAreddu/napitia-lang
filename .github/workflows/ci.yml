name: CI

on:
  push:
    branches: [alpha, beta, prod]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --manifest-path compiler/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path compiler/Cargo.toml
