[package]
name = "compiler"
version = "0.2.2-alpha.1"
edition = "2024"
# `rust-version` is Cargo's MSRV field: it would claim a *guaranteed
# minimum* rustc, which has never been established here (edition 2024
# itself only requires rustc >= 1.85). The one compiler this project is
# actually built and tested against is pinned instead, honestly, in
# `rust-toolchain.toml` at the repository root.

[[bin]]
name = "napitia"
path = "src/main.rs"

[dependencies]
# The only third-party dependency in this crate: parses napitia.toml
# manifests. TOML has real, non-trivial syntax (quoting, multi-line
# strings, dotted keys, escapes) that a bespoke partial parser would
# risk getting subtly wrong in exactly the cases that matter --
# silently accepting a malformed manifest the real format would
# reject. `toml` is the standard, actively-maintained implementation
# in the Rust ecosystem; used here only to parse into a generic
# `toml::Value` tree, which this crate then validates field-by-field
# itself (no `serde` derive, no schema magic) so every diagnostic stays
# in Napitia's own error model.
toml = "0.8"

# The native AOT backend (`src/native`, `rfcs/0014`). Cranelift is a
# code generator, not a compiler framework: it takes a typed CFG that
# already looks very much like NIR and produces machine code for one
# named target, with no IR-level language assumptions of its own and no
# C++ toolchain to build. That is exactly the surface this milestone
# needs, and no more -- `cranelift-jit` is deliberately absent, since
# `napitia build` compiles ahead of time and nothing here runs generated
# code in this process.
#
# `x86` is requested explicitly rather than relying on `host-arch`:
# `napitia build` always targets `x86_64-unknown-linux-gnu`, including
# from a host that is not one (an aarch64 macOS CI runner, say), so the
# backend that target needs has to be compiled in regardless of what
# the host happens to be.
cranelift-codegen = { version = "0.135.2", features = ["x86"] }
# Builds Cranelift IR from a CFG that is not already in SSA form --
# which NIR, whose locals are `alloc`/`load`/`store` slots, is not.
cranelift-frontend = "0.135.2"
# The `Module`/`Linkage` abstraction `cranelift-object` implements:
# declaring every function before any body is emitted.
cranelift-module = "0.135.2"
# Writes the compiled functions out as a real ELF object file. It is
# handed an ISA the backend has already selected, so the triple
# parsing that selection needs is declared separately, below, rather
# than reached through this crate.
cranelift-object = "0.135.2"
# Parses a target triple into the components `cranelift_codegen::isa`
# selects a backend from. Declared directly, rather than reached
# through Cranelift, because the alternative -- `isa::lookup_by_name`
# -- *panics* on a triple it cannot parse, and this compiler does not
# have a stage that panics on its input. Already in the dependency
# graph at this exact version as Cranelift's own; naming it here adds
# an edge, not a crate.
target-lexicon = "0.13.5"
