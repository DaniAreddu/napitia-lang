name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --manifest-path compiler/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path compiler/Cargo.toml
