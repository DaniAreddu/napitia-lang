name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

# Least privilege by default. Nothing in this workflow writes to the
# repository, publishes anything, or reads a secret, so the token it is
# handed should not be able to either -- and a job that later needs more
# has to ask for it explicitly, where a reviewer will see it.
permissions:
  contents: read

# A branch that is pushed twice in quick succession only needs its
# newest commit checked; the older run is answering a question nobody is
# waiting on any more. Never cancels on the default branch, where every
# commit's own result is a record worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/alpha' }}

env:
  CARGO_TERM_COLOR: always
  # A dependency this project does not declare has no business being
  # fetched during a check of it.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Formatting is its own gate because it is the one check whose failure
  # says nothing about correctness -- keeping it separate stops a
  # whitespace difference from being reported as "the compiler is
  # broken".
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path compiler/Cargo.toml --all --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy

      # Keyed by everything that can change what is built: the runner,
      # the pinned toolchain, and the exact lockfile. A cache shared
      # across any of those would be serving artifacts for a different
      # compilation than the one being checked.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: ${{ runner.os }}-1.97.1-lint-${{ hashFiles('compiler/Cargo.lock') }}

      - name: cargo clippy
        run: >-
          cargo clippy
          --manifest-path compiler/Cargo.toml
          --all-targets
          --all-features
          --locked
          -- -D warnings

  # Every platform the compiler is expected to build and run on. A
  # failure here is a real portability defect, not a flake, so no
  # platform is allowed to be advisory: `fail-fast: false` reports all
  # three rather than hiding two behind the first.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.97.1"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: ${{ runner.os }}-1.97.1-test-${{ hashFiles('compiler/Cargo.lock') }}

      - name: cargo build
        run: >-
          cargo build
          --manifest-path compiler/Cargo.toml
          --all-targets
          --all-features
          --locked

      - name: cargo test (debug)
        run: >-
          cargo test
          --manifest-path compiler/Cargo.toml
          --all-targets
          --all-features
          --locked

      # Release is a separate run, not a duplicate one. `debug_assert!`
      # disappears, overflow checks change, and optimizations reorder
      # work -- so a suite that passes in debug genuinely can fail here,
      # and has.
      - name: cargo test (release)
        run: >-
          cargo test
          --manifest-path compiler/Cargo.toml
          --release
          --all-targets
          --all-features
          --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.97.1"

      # This codebase documents its own internals heavily, so a broken
      # intra-doc link is a real defect in the thing most likely to be
      # read.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          --manifest-path compiler/Cargo.toml
          --all-features
          --no-deps
          --locked

  # Supply chain. Advisories are checked against the exact lockfile that
  # will be built, not against whatever resolves today.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: RustSec advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The crate lives under `compiler/`, not at the repository
          # root; the default would look for a lockfile that is not
          # there and report the miss as a parse failure.
          working-directory: compiler

  # The workflows are code that runs with access to a checkout, so they
  # are linted like code. `actionlint` also runs `shellcheck` over every
  # `run:` block, which is where a quoting mistake would actually bite.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The archive is fetched from a GitHub release, which is mutable:
      # whoever can publish that release can replace the asset, and this
      # binary then runs against a checkout. Pinning the version alone
      # does not prevent that -- only pinning the *bytes* does.
      #
      # The digest is recorded here, in this repository, under review.
      # `sha256sum -c` fails the job if the download does not match it,
      # so a replaced asset stops the workflow instead of executing.
      # Bumping the version means changing this line too, which is the
      # point: it becomes a reviewable change rather than a silent one.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            -o "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          ./actionlint -color

      # Every action must be pinned to a full commit SHA. A tag is
      # mutable, so `@v4` is a promise from whoever can move it rather
      # than a fact about the code that will run against this checkout.
      - name: Every action is pinned to a commit
        run: |
          set -euo pipefail
          if grep -rnP '^\s*-?\s*uses:\s*[^#]*@(?!.*[0-9a-f]{40})' .github/workflows; then
            echo "::error::an action above is not pinned to a full commit SHA" >&2
            exit 1
          fi
          echo "every action is pinned"

  # The one thing CI cannot check from the branch alone: that nothing
  # introduced a whitespace error relative to where this work is
  # actually going.
  base-diff:
    name: Base diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history to reach the merge base with the target
          # branch; a shallow checkout cannot compute one.
          fetch-depth: 0
          persist-credentials: false

      - name: git diff --check against the base
        env:
          # The PR's own target branch, falling back to `alpha` for a
          # plain branch push. Read from the environment rather than
          # interpolated into the script, so a branch name can never be
          # read as shell.
          BASE_REF: ${{ github.base_ref || 'alpha' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --check "origin/${BASE_REF}...HEAD"
          echo "no whitespace errors against origin/${BASE_REF}"
